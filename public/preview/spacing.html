
<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing — Base-8 Scale" subtitle="4 → 80px" viewport="700x360" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-cream); background-image: var(--texture-cream); background-size: cover; min-height: 100vh; }
</style>
</head>
<body>

<div style="display:grid; grid-template-columns: 60px 1fr 60px; align-items:center; gap: 12px 16px; font: var(--type-body-sm); color: var(--fg-2);">

  <div style="font: var(--type-mono-sm); color: var(--fg-3); text-align:right;">4px</div>
  <div style="height: 12px; background: #2D6A4F; border-radius: 2px; width: 4px;"></div>
  <div style="font: var(--type-mono-sm); color: var(--fg-3);">micro</div>

  <div style="font: var(--type-mono-sm); color: var(--fg-3); text-align:right;">8px</div>
  <div style="height: 12px; background: #2D6A4F; border-radius: 2px; width: 8px;"></div>
  <div style="font: var(--type-mono-sm); color: var(--fg-3);">xs</div>

  <div style="font: var(--type-mono-sm); color: var(--fg-3); text-align:right;">12px</div>
  <div style="height: 12px; background: #2D6A4F; border-radius: 2px; width: 12px;"></div>
  <div style="font: var(--type-mono-sm); color: var(--fg-3);">sm</div>

  <div style="font: var(--type-mono-sm); color: var(--fg-3); text-align:right;">16px</div>
  <div style="height: 12px; background: #2D6A4F; border-radius: 2px; width: 16px;"></div>
  <div style="font: var(--type-mono-sm); color: var(--fg-3);">base</div>

  <div style="font: var(--type-mono-sm); color: var(--fg-3); text-align:right;">20px</div>
  <div style="height: 12px; background: #2D6A4F; border-radius: 2px; width: 20px;"></div>
  <div style="font: var(--type-mono-sm); color: var(--fg-3);">md</div>

  <div style="font: var(--type-mono-sm); color: var(--fg-3); text-align:right;">24px</div>
  <div style="height: 12px; background: #2D6A4F; border-radius: 2px; width: 24px;"></div>
  <div style="font: var(--type-mono-sm); color: var(--fg-3);">lg</div>

  <div style="font: var(--type-mono-sm); color: var(--fg-3); text-align:right;">32px</div>
  <div style="height: 12px; background: #2D6A4F; border-radius: 2px; width: 32px;"></div>
  <div style="font: var(--type-mono-sm); color: var(--fg-3);">xl</div>

  <div style="font: var(--type-mono-sm); color: var(--fg-3); text-align:right;">48px</div>
  <div style="height: 12px; background: #2D6A4F; border-radius: 2px; width: 48px;"></div>
  <div style="font: var(--type-mono-sm); color: var(--fg-3);">2xl</div>

  <div style="font: var(--type-mono-sm); color: var(--fg-3); text-align:right;">64px</div>
  <div style="height: 12px; background: #2D6A4F; border-radius: 2px; width: 64px;"></div>
  <div style="font: var(--type-mono-sm); color: var(--fg-3);">3xl</div>

  <div style="font: var(--type-mono-sm); color: var(--fg-3); text-align:right;">80px</div>
  <div style="height: 12px; background: #2D6A4F; border-radius: 2px; width: 80px;"></div>
  <div style="font: var(--type-mono-sm); color: var(--fg-3);">4xl</div>

</div>
</body></html>

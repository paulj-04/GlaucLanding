
<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors — Primary" subtitle="Forest · Sage · Mint · Mist" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-cream); background-image: var(--texture-cream); background-size: cover; min-height: 100vh; }
  .card-root { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-subtle); padding: 24px; box-shadow: var(--shadow-1); }
  .swatch-row { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
  .swatch { display: flex; flex-direction: column; gap: 4px; }
  .swatch .chip { aspect-ratio: 1.6/1; border-radius: var(--radius-subtle); border: 1px solid rgba(0,0,0,0.05); }
  .swatch .nm { font: var(--type-body-md); color: var(--fg-1); margin-top: 6px; }
  .swatch .hx { font: var(--type-mono-sm); color: var(--fg-3); }
</style>
</head>
<body>

<div class="swatch-row" style="grid-template-columns: repeat(5, 1fr);">
  <div class="swatch">
    <div class="chip" style="background:#789D7F; position: relative;">
      <img src="../assets/logo-g-white.png" alt="" style="position:absolute; right:6px; bottom:6px; width:22px; height:22px; opacity:0.85;" />
    </div>
    <div class="nm">Glauc Sage <span style="font:500 9px 'DM Mono',monospace; letter-spacing:0.08em; background:#789D7F; color:#fff; padding:2px 6px; border-radius:50px; margin-left:4px;">LOGO</span></div>
    <div class="hx">#789D7F</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#1A3A2A"></div>
    <div class="nm">Forest</div>
    <div class="hx">#1A3A2A</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#2D6A4F"></div>
    <div class="nm">Sage Deep</div>
    <div class="hx">#2D6A4F</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#52B788"></div>
    <div class="nm">Mint</div>
    <div class="hx">#52B788</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#D8F3DC"></div>
    <div class="nm">Mist</div>
    <div class="hx">#D8F3DC</div>
  </div>
</div>
<div style="margin-top:14px; font: var(--type-body-sm); color:var(--fg-3);">
  <strong style="color:var(--fg-1); font-weight:500;">Glauc Sage</strong> is the canonical logo color and primary brand identity. Forest is reserved for high-contrast surfaces and dark UI.
</div>
</body></html>

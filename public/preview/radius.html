
<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Radius — Corner Tokens" subtitle="2 / 4 / 8 / 12 / pill / full" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-cream); background-image: var(--texture-cream); background-size: cover; min-height: 100vh; }
</style>
</head>
<body>

<div style="display:grid; grid-template-columns: repeat(6, 1fr); gap: 16px; text-align:center;">
  
  <div>
    <div style="width:64px;height:64px;margin:0 auto;background:#fff;border:1px solid var(--color-border);border-radius:2px;"></div>
    <div style="font: var(--type-body-md); margin-top:8px;">sharp</div>
    <div style="font: var(--type-mono-sm); color: var(--fg-3);">2px</div>
    <div style="font: var(--type-body-sm); color: var(--fg-3);">tables</div>
  </div>
  
  <div>
    <div style="width:64px;height:64px;margin:0 auto;background:#fff;border:1px solid var(--color-border);border-radius:4px;"></div>
    <div style="font: var(--type-body-md); margin-top:8px;">subtle</div>
    <div style="font: var(--type-mono-sm); color: var(--fg-3);">4px</div>
    <div style="font: var(--type-body-sm); color: var(--fg-3);">cards / buttons</div>
  </div>
  
  <div>
    <div style="width:64px;height:64px;margin:0 auto;background:#fff;border:1px solid var(--color-border);border-radius:8px;"></div>
    <div style="font: var(--type-body-md); margin-top:8px;">rounded</div>
    <div style="font: var(--type-mono-sm); color: var(--fg-3);">8px</div>
    <div style="font: var(--type-body-sm); color: var(--fg-3);">toasts</div>
  </div>
  
  <div>
    <div style="width:64px;height:64px;margin:0 auto;background:#fff;border:1px solid var(--color-border);border-radius:12px;"></div>
    <div style="font: var(--type-body-md); margin-top:8px;">soft</div>
    <div style="font: var(--type-mono-sm); color: var(--fg-3);">12px</div>
    <div style="font: var(--type-body-sm); color: var(--fg-3);">modals</div>
  </div>
  
  <div>
    <div style="width:64px;height:64px;margin:0 auto;background:#fff;border:1px solid var(--color-border);border-radius:50px;"></div>
    <div style="font: var(--type-body-md); margin-top:8px;">pill</div>
    <div style="font: var(--type-mono-sm); color: var(--fg-3);">50px</div>
    <div style="font: var(--type-body-sm); color: var(--fg-3);">badges</div>
  </div>
  
  <div>
    <div style="width:64px;height:64px;margin:0 auto;background:#fff;border:1px solid var(--color-border);border-radius:999px;"></div>
    <div style="font: var(--type-body-md); margin-top:8px;">full</div>
    <div style="font: var(--type-mono-sm); color: var(--fg-3);">999px</div>
    <div style="font: var(--type-body-sm); color: var(--fg-3);">avatars</div>
  </div>
  
</div>
</body></html>

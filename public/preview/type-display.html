
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  body { margin: 0; padding: 24px; background: var(--color-cream); background-image: var(--texture-cream); background-size: cover; min-height: 100vh; }

  .specimen + .specimen { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--color-border); }

</style>
</head>
<body>

<div class="specimen">
  <div style="font: var(--type-display-1); color: var(--fg-1);">$139<sup style="font-size:0.5em;vertical-align:0.55em">B</sup></div>
  <div class="meta">DISPLAY 1 · Instrument Serif 48 / 1.05</div>
</div>
<div class="specimen">
  <div style="font: var(--type-display-2); color: var(--fg-1);">20%</div>
  <div class="meta">DISPLAY 2 · 40 / 1.08</div>
</div>
<div class="specimen">
  <div style="font: var(--type-display-3); color: var(--fg-1);"><span class="emph">half</span> of them</div>
  <div class="meta">DISPLAY 3 · 36 / 1.12  ·  italic for emphasis</div>

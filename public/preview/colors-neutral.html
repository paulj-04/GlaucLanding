
<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors — Neutral" subtitle="Ink → White, 7 steps" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-cream); background-image: var(--texture-cream); background-size: cover; min-height: 100vh; }
  .card-root { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-subtle); padding: 24px; box-shadow: var(--shadow-1); }
  .swatch-row { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
  .swatch { display: flex; flex-direction: column; gap: 4px; }
  .swatch .chip { aspect-ratio: 1.6/1; border-radius: var(--radius-subtle); border: 1px solid rgba(0,0,0,0.05); }
  .swatch .nm { font: var(--type-body-md); color: var(--fg-1); margin-top: 6px; }
  .swatch .hx { font: var(--type-mono-sm); color: var(--fg-3); }
</style>
</head>
<body>

<div class="swatch-row" style="grid-template-columns: repeat(7, 1fr);">
  <div class="swatch"><div class="chip" style="background:#1A1A18"></div><div class="nm">Ink</div><div class="hx">#1A1A18</div></div>
  <div class="swatch"><div class="chip" style="background:#4A5568"></div><div class="nm">Slate</div><div class="hx">#4A5568</div></div>
  <div class="swatch"><div class="chip" style="background:#718096"></div><div class="nm">Stone</div><div class="hx">#718096</div></div>
  <div class="swatch"><div class="chip" style="background:#E2DDD8"></div><div class="nm">Border</div><div class="hx">#E2DDD8</div></div>
  <div class="swatch"><div class="chip" style="background:#F4F5F6"></div><div class="nm">Light</div><div class="hx">#F4F5F6</div></div>
  <div class="swatch"><div class="chip" style="background:#F7F3EE"></div><div class="nm">Cream</div><div class="hx">#F7F3EE</div></div>
  <div class="swatch"><div class="chip" style="background:#FFFFFF;border:1px solid #E2DDD8"></div><div class="nm">White</div><div class="hx">#FFFFFF</div></div>
</div>
</body></html>

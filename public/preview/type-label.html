
<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — Labels" subtitle="Uppercase, tracked 0.08em" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-cream); background-image: var(--texture-cream); background-size: cover; min-height: 100vh; }
  .specimen { display: grid; gap: 4px; }
  .specimen + .specimen { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--color-border); }
  .meta { font: var(--type-mono-sm); color: var(--fg-3); letter-spacing: 0.04em; }
</style>
</head>
<body>

<div class="specimen">
  <div style="font: var(--type-label-lg); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-2);">Inflammation</div>
  <div class="meta">LABEL LG · DM Sans Medium 12 · tracked 0.08em</div>
</div>
<div class="specimen">
  <div style="font: var(--type-label); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-2);">Tap for Details</div>
  <div class="meta">LABEL · 11 · tracked 0.08em</div>
</div>
<div class="specimen">
  <div style="display:flex; gap:6px; align-items:center;">
    <span style="font: var(--type-label-sm); text-transform: uppercase; letter-spacing: 0.08em; background:#FDF0DF; color:#C97D2E; padding:3px 8px; border-radius:50px;">Moderate</span>
    <span style="font: var(--type-label-sm); text-transform: uppercase; letter-spacing: 0.08em; background:#D8F3DC; color:#2D6A4F; padding:3px 8px; border-radius:50px;">Optimal</span>
    <span style="font: var(--type-label-sm); text-transform: uppercase; letter-spacing: 0.08em; background:#FDF0EF; color:#C0392B; padding:3px 8px; border-radius:50px;">Elevated</span>
  </div>
  <div class="meta">LABEL SM · 10 · risk pill usage</div>
</div>
</body></html>

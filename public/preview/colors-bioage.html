
<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors — Biological Age Delta" subtitle="Younger · Neutral · Accelerated" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--color-cream); background-image: var(--texture-cream); background-size: cover; min-height: 100vh; }
  .card-root { background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-subtle); padding: 24px; box-shadow: var(--shadow-1); }
  .swatch-row { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
  .swatch { display: flex; flex-direction: column; gap: 4px; }
  .swatch .chip { aspect-ratio: 1.6/1; border-radius: var(--radius-subtle); border: 1px solid rgba(0,0,0,0.05); }
  .swatch .nm { font: var(--type-body-md); color: var(--fg-1); margin-top: 6px; }
  .swatch .hx { font: var(--type-mono-sm); color: var(--fg-3); }
</style>
</head>
<body>

<div class="swatch-row" style="grid-template-columns:repeat(3,1fr);">
  <div class="swatch">
    <div class="chip" style="background:#52B788; position: relative; display: flex; align-items: center; justify-content: center;">
      <span style="font:400 28px/1 'DM Serif Display',serif;color:#fff;">−5</span>
    </div>
    <div class="nm">Younger</div>
    <div class="hx">#52B788</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#718096; position: relative; display: flex; align-items: center; justify-content: center;">
      <span style="font:400 28px/1 'DM Serif Display',serif;color:#fff;">±0</span>
    </div>
    <div class="nm">Neutral</div>
    <div class="hx">#718096</div>
  </div>
  <div class="swatch">
    <div class="chip" style="background:#C97D2E; position: relative; display: flex; align-items: center; justify-content: center;">
      <span style="font:400 28px/1 'DM Serif Display',serif;color:#fff;">+3</span>
    </div>
    <div class="nm">Accelerated</div>
    <div class="hx">#C97D2E</div>
  </div>
</div>
<div style="margin-top:14px; font: var(--type-body-sm); color:var(--fg-3);">Biological age delta vs chronological — younger / matching / older.</div>
</body></html>
